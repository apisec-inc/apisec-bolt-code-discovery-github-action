name: 'Code Discovery - API Discovery'
description: 'Discover API endpoints with Surface CLI and upload them to APIsec'
author: 'APIsec'

branding:
  icon: 'search'
  color: 'blue'

inputs:
  api-endpoint:
    description: 'APIsec applicationsservice base URL (same as Surface --api-url)'
    required: true
  api-token:
    description: 'APIsec personal access token'
    required: true
  repo-path:
    description: 'Path to repository root to analyze'
    required: false
    default: '.'
  config-path:
    description: 'Ignored. Surface does not use .codediscovery.yml. Kept so existing workflows do not break.'
    required: false
    default: '.codediscovery.yml'
  pr-title:
    description: 'Ignored. The Action no longer opens a spec PR.'
    required: false
    default: 'chore: update OpenAPI specification'
  pr-body:
    description: 'Ignored. The Action no longer opens a spec PR.'
    required: false
    default: 'Automatically generated OpenAPI specification'
  dry-run:
    description: 'Analyse only; do not register or upload'
    required: false
    default: 'false'
  host-url:
    description: 'Ignored. Set the instance host in the APIsec console after the app is created.'
    required: false
    default: ''

outputs:
  spec-path:
    description: 'Empty. The spec is published by the reasoning engine, not written to the repo.'
    value: ${{ steps.discovery.outputs.spec-path }}
  endpoints-count:
    description: 'Number of API routes found'
    value: ${{ steps.discovery.outputs.endpoints-count }}
  frameworks-detected:
    description: 'Comma-separated list of detected frameworks'
    value: ${{ steps.discovery.outputs.frameworks-detected }}
  application-id:
    description: 'APIsec application id (if uploaded)'
    value: ${{ steps.discovery.outputs.application-id }}
  instance-id:
    description: 'Empty. Surface does not return an instance id.'
    value: ${{ steps.discovery.outputs.instance-id }}
  pr-url:
    description: 'Empty. The Action no longer opens a spec PR.'
    value: ${{ steps.discovery.outputs.pr-url }}
  success:
    description: 'true only when the CLI exited 0'
    value: ${{ steps.discovery.outputs.success }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Surface CLI
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "apisec-surface==1.0.0"
        apisec-surface telemetry off || true

    - name: Run Surface discovery
      id: discovery
      shell: bash
      continue-on-error: true
      env:
        API_ENDPOINT: ${{ inputs.api-endpoint }}
        API_TOKEN: ${{ inputs.api-token }}
        REPO_PATH: ${{ inputs.repo-path }}
        DRY_RUN: ${{ inputs.dry-run }}
        CONFIG_PATH: ${{ inputs.config-path }}
        HOST_URL: ${{ inputs.host-url }}
        APISEC_CANONICAL_REPO_ID: github:${{ github.repository_id }}
        APISEC_RUN_PROFILE: legacy
        APISEC_REGISTRATION_CODE: ci-github-action
        APISEC_PAT: ${{ inputs.api-token }}
      run: |
        if [ "$CONFIG_PATH" != ".codediscovery.yml" ]; then
          echo "::warning::config-path is ignored; Surface does not use .codediscovery.yml"
        fi
        if [ -n "$HOST_URL" ]; then
          echo "::warning::host-url is ignored; set the instance host in the APIsec console after the app is created"
        fi

        ARGS=(--log-format json analyze "$REPO_PATH" --no-detect-monorepo --skip-if-no-routes --api-url "$API_ENDPOINT")
        if [ "$DRY_RUN" = "true" ]; then
          ARGS+=(--dry-run)
        fi
        set +e
        apisec-surface "${ARGS[@]}" 2>scan.ndjson
        RC=$?
        set -e
        cat scan.ndjson >&2

        RC="$RC" python - <<'PY'
        import json
        import os
        from pathlib import Path

        routes = ""
        frameworks = ""
        ndjson = Path("scan.ndjson")
        if ndjson.exists():
            for line in ndjson.read_text(encoding="utf-8", errors="replace").splitlines():
                try:
                    obj = json.loads(line)
                except json.JSONDecodeError:
                    continue
                if obj.get("event") == "scan_complete":
                    routes = str(obj.get("routes_found", ""))
                    frameworks = ",".join(obj.get("frameworks") or [])

        state = Path(os.environ["REPO_PATH"]) / "apisec-code-bolt" / "state.yaml"
        app_id = ""
        if state.exists():
            for line in state.read_text(encoding="utf-8", errors="replace").splitlines():
                if line.startswith("applicationId:"):
                    app_id = line.split(":", 1)[1].strip().strip("\"'")
                    break

        out = os.environ["GITHUB_OUTPUT"]
        with open(out, "a", encoding="utf-8") as fh:
            fh.write(f"endpoints-count={routes}\n")
            fh.write(f"frameworks-detected={frameworks}\n")
            fh.write(f"application-id={app_id}\n")
            fh.write("spec-path=\ninstance-id=\npr-url=\n")
            fh.write(f"success={'true' if os.environ['RC'] == '0' else 'false'}\n")
        PY
        exit 0
